name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's packageManager field, which is the single
      # source of truth. Passing it here as well is not belt and braces, it is a hard
      # error: the action refuses to run when both are set. That is why every CI run
      # since the first commit failed before it installed anything.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Boundaries and house style are a build failure, not a review comment.
      # This is where "beam-core imports nothing" and "no em dashes anywhere"
      # actually get enforced.
      - name: lint, boundaries and house style
        run: pnpm lint

      # ESLint only sees .ts and .js. UI copy lives in .html and .vue, so the
      # house-style rule has to cover those too or it is unenforced exactly where
      # it matters most.
      - name: house style in templates and docs
        run: pnpm check:style

      # One sketch per folder, folder named after it. The IDE concatenates every
      # .ino in a folder into one translation unit, so this is a real build break
      # that nothing else in CI can see: it is not about the code, it is about
      # which files the IDE decides belong together.
      - name: arduino sketch layout
        run: pnpm check:sketches

      - name: typecheck and build packages
        run: pnpm typecheck

      - name: invariant citations resolve
        run: pnpm check:invariants

      - name: unit tests
        run: pnpm test

      # The generated protocol header must match the one in the tree. The wire
      # contract has exactly one source and this is what stops the firmware and
      # the library from drifting apart, which has already happened once.
      - name: protocol spec has not drifted
        run: |
          if [ -d tools/gen-protocol ] && [ -f tools/gen-protocol/index.js ]; then
            node tools/gen-protocol/index.js --check
          else
            echo "gen-protocol not implemented yet, skipping (M1)"
          fi
